<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vorrat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vorratslager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121c;--card:#1e1b2b;--line:#2d2940;--tx:#f1eefb;--mu:#9a94b3;--ac:#a78bfa;--bad:#f87171;--ok:#6ee7b7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1{font-size:30px;margin:18px 16px 4px;font-weight:700;letter-spacing:-.5px}
#ytBox{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:12px}
#ytBox.on{display:flex}
#ytWrap{width:min(100%,720px);aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
#ytWrap iframe{width:100%;height:100%;border:0;display:block}
#title{cursor:pointer;-webkit-user-select:none;user-select:none}
h1 em{font-family:'Instrument Serif',serif;font-weight:400;color:var(--ac);font-size:1.15em}
.sub{margin:0 16px 12px;color:var(--mu);font-size:14px}
main{max-width:720px;margin:0 auto;padding:0 12px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 4px 12px}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);color:var(--mu);border:1px solid var(--line)}
.chip.on{background:var(--ac);color:#1a1230;border-color:var(--ac);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:16px;margin-bottom:8px}
.ph{width:52px;height:52px;border-radius:12px;background:#2a2640;flex:none;object-fit:cover;display:grid;place-items:center;font-weight:700;color:var(--ac);font-size:20px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:13px;color:var(--mu);margin-top:2px}
.mt .bad{color:var(--bad)}.mt .warn{color:#fbbf24}
.btns{display:flex;gap:6px;flex:none}
.ib{width:40px;height:40px;border-radius:12px;background:#2a2640;font-size:18px;display:grid;place-items:center}
.ib.p{background:var(--ac);color:#1a1230;font-weight:700}
.add{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#1a1230;font-size:30px;box-shadow:0 6px 20px #0008;z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;background:#191625f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none;z-index:6}
nav button{flex:1 0 auto;min-width:64px;background:none;color:var(--mu);padding:6px 8px;border-radius:12px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--ac);background:#a78bfa1f}
.srow{display:flex;gap:8px;margin-bottom:8px}.srow .chk{margin:0;flex:1;width:auto}
.chk{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid #4a4466;flex:none;display:grid;place-items:center;color:transparent;font-size:15px;transition:.15s}
.chk.done .dot{background:var(--ac);border-color:var(--ac);color:#fff}
.chk.done .t{text-decoration:line-through;color:var(--mu)}
.h2{margin:16px 6px 8px;font-size:13px;color:var(--mu);font-weight:500}
.inl{display:flex;gap:8px;margin-bottom:12px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:26px;height:26px;padding:0;flex:none;border-radius:8px;border:2px solid #4a4466;background:transparent;display:grid;place-items:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
input[type=checkbox]:checked::after{content:'✓';color:#1a1230;font-size:16px;font-weight:700;line-height:1}
input[type=file]{color:var(--mu);font-size:14px;padding:8px}
input[type=file]::file-selector-button{background:#2a2640;color:var(--tx);border:0;border-radius:10px;padding:10px 14px;margin-right:10px;font:inherit;cursor:pointer}
:root{color-scheme:dark}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;display:block;text-align:left;color:var(--tx);background:var(--card)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6) sepia(1) saturate(4) hue-rotate(215deg);cursor:pointer}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.btn{background:var(--ac);color:#1a1230;font-weight:700;padding:12px 18px;border-radius:12px;flex:none}
.btn.g{background:#2a2640;color:var(--tx)}
.empty{color:var(--mu);text-align:center;padding:28px 12px}
.stat{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;background:var(--card);border-radius:16px;padding:16px 14px 10px}
.bg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bp{display:flex;align-items:flex-end;gap:3px;flex:1;width:100%}
.bp i{flex:1;border-radius:5px 5px 0 0;min-height:2px;display:block}
.bp i.u{background:var(--ac)}.bp i.x{background:var(--bad)}
.bg small{color:var(--mu);font-size:11px}
.leg{display:flex;gap:16px;margin:10px 4px;font-size:13px;color:var(--mu)}
.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:var(--card);border-radius:14px;padding:14px}
.kpi strong{display:block;font-size:26px}
.kpi span{font-size:13px;color:var(--mu)}
.rc{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px}
.rc h3{margin:0 0 4px;font-size:17px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:#2a2640;color:var(--mu);margin:3px 4px 0 0}
.pill.y{background:#6ee7b722;color:var(--ok)}.pill.n{background:#f8717122;color:var(--bad)}
.bar{height:6px;border-radius:9px;background:#2a2640;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
dialog{border:0;border-radius:20px;background:#1e1b2b;color:var(--tx);width:min(92vw,440px);padding:18px;max-height:90vh}
dialog::backdrop{background:#000a}
dialog label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.lock .ic{font-size:44px}
.lock input{max-width:300px;text-align:center}
.lock .btn{width:100%;max-width:300px}
.err{color:var(--bad);min-height:20px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top .btn{margin:18px 16px 0 0;padding:8px 14px;font-size:14px}

.tb{display:flex;gap:8px;margin:18px 16px 0 0;align-items:flex-start}
.tb .btn{margin:0}
#instTop{display:none;position:relative;overflow:hidden;animation:pulse 2.4s ease-in-out infinite}
#instTop::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff7 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s infinite}
#instTop .ar{display:inline-block;animation:bob 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #a78bfa77}60%{box-shadow:0 0 0 9px #a78bfa00}}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes bob{50%{transform:translateY(3px)}}
#instHint{margin:0 12px;max-height:0;opacity:0;overflow:hidden;transition:max-height .45s ease,opacity .3s ease,margin .3s ease}
#instHint.on{max-height:300px;opacity:1;margin:0 12px 12px}
#instHint .in{background:var(--card);border:1px solid var(--ac);border-radius:16px;padding:14px 16px}
#instHint ol{margin:10px 0 0;padding-left:22px;color:var(--mu);font-size:14px}
#instHint li{margin:6px 0;opacity:0;transform:translateY(8px)}
#instHint.on li{animation:rise .45s ease forwards}
#instHint.on li:nth-child(2){animation-delay:.12s}#instHint.on li:nth-child(3){animation-delay:.24s}
@keyframes rise{to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,24px) scale(.9);opacity:0;pointer-events:none;background:var(--ok);color:#06281c;font-weight:700;padding:12px 18px;border-radius:99px;z-index:40;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .25s}
#toast.on{transform:translate(-50%,0) scale(1);opacity:1}

/* Animationen */
html{background:var(--bg)}body{background:transparent}
body::before{content:'';position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 32% at 18% 12%,#a78bfa26,transparent 70%),radial-gradient(34% 30% at 86% 82%,#6ee7b71c,transparent 70%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.12)}}
button{transition:transform .15s ease,background-color .2s ease,color .2s ease,opacity .2s}
button:active{transform:scale(.93)}
.chip{transition:background-color .2s,color .2s,border-color .2s,transform .15s}
.row,.rc,.kpi div,.chk{transition:transform .2s ease,box-shadow .2s ease}
.rc:hover,.row:hover{transform:translateY(-2px);box-shadow:0 8px 22px #0006}
#main.enter>*{animation:rise2 .5s cubic-bezier(.2,.8,.2,1) both}
#main.enter>:nth-child(2){animation-delay:.04s}#main.enter>:nth-child(3){animation-delay:.08s}#main.enter>:nth-child(4){animation-delay:.12s}#main.enter>:nth-child(5){animation-delay:.16s}#main.enter>:nth-child(6){animation-delay:.2s}#main.enter>:nth-child(7){animation-delay:.24s}#main.enter>:nth-child(8){animation-delay:.28s}#main.enter>:nth-child(9){animation-delay:.32s}#main.enter>:nth-child(10){animation-delay:.36s}#main.enter>:nth-child(n+11){animation-delay:.4s}
@keyframes rise2{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#main.enter .kpi div{animation:rise2 .5s cubic-bezier(.2,.8,.2,1) both}
#main.enter .kpi div:nth-child(2){animation-delay:.1s}#main.enter .kpi div:nth-child(3){animation-delay:.2s}#main.enter .kpi div:nth-child(4){animation-delay:.3s}
#main.enter .bp i{transform-origin:bottom;animation:growY .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#main.enter .bar i{transform-origin:left;animation:growX .9s cubic-bezier(.2,.9,.3,1) .15s both}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#title.sw,#sub.sw{animation:swap .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.row.pop{animation:popRow .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes popRow{0%{transform:scale(.9);background:#3a3466}60%{transform:scale(1.03)}100%{transform:none}}
.chk.pop{animation:popRow .5s cubic-bezier(.2,1.4,.4,1)}
.chk.pop.done .dot{animation:dotPop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes dotPop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.gone{animation:gone .23s ease-in forwards;pointer-events:none}
@keyframes gone{to{opacity:0;transform:translateX(40px) scale(.9)}}
dialog[open]{animation:dlgIn .35s cubic-bezier(.2,1.2,.4,1)}
dialog[open]::backdrop{animation:fade .3s ease}
@keyframes dlgIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#fab{animation:fabIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes fabIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
nav button.on span{animation:navB .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes navB{0%{transform:translateY(6px) scale(.8)}100%{transform:none}}
.lock{transition:opacity .28s ease,transform .28s ease}.lock.out{opacity:0;transform:scale(1.04);pointer-events:none}
.lock>*{animation:rise2 .6s cubic-bezier(.2,.8,.2,1) both}
.lock>:nth-child(2){animation-delay:.08s}.lock>:nth-child(3){animation-delay:.16s}.lock>:nth-child(n+4){animation-delay:.24s}
.lock .ic{animation:rise2 .6s both,floaty 3.2s ease-in-out .6s infinite}
@keyframes floaty{50%{transform:translateY(-8px) rotate(-4deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){*,*::after,*::before{transition:none!important;animation:none!important}#instHint li{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="ic">🔒</div>
  <h1 style="margin:0">Dein <em>Vorrat</em></h1>
  <p class="sub" id="lockHint" style="margin:0"></p>
  <input id="pw" type="password" inputmode="numeric" placeholder="Passwort" autocomplete="current-password">
  <input id="pw2" type="password" placeholder="Passwort wiederholen" style="display:none" autocomplete="new-password">
  <div class="err" id="lockErr"></div>
  <button class="btn" id="lockBtn">Entsperren</button>
</div>

<div class="top"><div><h1 id="title"></h1><p class="sub" id="sub"></p><p class="sub" id="syn" style="font-size:12px;margin-top:-8px"></p></div><div class="tb"><button class="btn" id="instTop"><span class="ar">📲</span> App laden</button><button class="btn g" id="lockNow">Sperren</button></div></div>
<div id="instHint"><div class="in"><b id="instH"></b><ol id="instOl"></ol></div></div>
<div id="toast"></div>
<main id="main"></main>
<button class="add" id="fab" aria-label="Artikel hinzufügen">+</button>
<nav id="nav"></nav>
<div id="ytBox"><div id="ytWrap"><div id="yt"></div></div></div>

<dialog id="dlg"><form method="dialog" id="f" style="margin:0">
  <h2 id="dT" style="margin:0 0 6px">Artikel</h2>
  <label>Name</label><input id="fName" required>
  <label>Barcode (optional, holt Name und Foto)</label>
  <div class="inl" style="margin:0"><input id="fBc" inputmode="numeric" placeholder="z. B. 4008400402222"><button type="button" class="btn g" id="fLook">Suchen</button></div>
  <div class="two">
    <div><label>Menge</label><input id="fQty" type="number" min="0" value="1" inputmode="numeric"></div>
    <div><label>Mindestbestand</label><input id="fMin" type="number" min="0" value="1" inputmode="numeric"></div>
    <div><label>Haltbar bis</label><input id="fExp" type="date"></div>
    <div><label>Preis in €</label><input id="fPrice" type="number" min="0" step="0.01" inputmode="decimal"></div>
    <div><label>Gewicht in g (optional)</label><input id="fGram" type="number" min="0" inputmode="numeric"></div>
    <div><label>Anzahl pro Packung (optional)</label><input id="fPack" type="number" min="0" inputmode="numeric"></div>
  </div>
  <label>Gruppe</label><select id="fGrp"></select>
  <label style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input id="fFr" type="checkbox"> Tiefkühl</label>
  <label>Foto (optional)</label><input id="fImg" type="file" accept="image/*">
  <div class="inl" style="margin:16px 0 0"><button type="button" class="btn g" id="fCancel">Abbrechen</button><button type="button" class="btn" id="fSave" style="flex:1">Speichern</button></div>
  <button type="button" class="btn g" id="fDel" style="margin-top:8px;width:100%;color:var(--bad)">Artikel löschen</button>
</form></dialog>

<script>
/* Fehleranzeige: zeigt JavaScript-Fehler sichtbar an, damit man sie melden kann */
function showErr(m){let d=document.getElementById('errBar');if(!d){d=document.createElement('div');d.id='errBar';d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#f87171;color:#1a1230;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700';d.onclick=()=>d.remove();document.body.appendChild(d)}d.textContent='Fehler: '+m+' (antippen zum Schließen)'}
addEventListener('error',e=>showErr((e.message||'unbekannt')+' – Zeile '+e.lineno));
addEventListener('unhandledrejection',e=>showErr(String(e.reason&&e.reason.message||e.reason)));
const GROUPS=['Lebensmittel','Getränke','Haushalt','Sonstiges'];
const FG=['Fisch','Fleisch','Gemüse','Fertiggerichte','Eis & Süßes','Sonstiges'];
const TABS=[['lager','📦','Lager'],['frost','❄️','Tiefkühl'],['auf','⏳','Aufbrauchen'],['kauf','🛒','Einkauf'],['stat','📊','Statistik'],['rez','🍳','Rezepte']];

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const PW='6767';

  $('#lock').classList.remove('out');$('#lock').style.display='flex';$('#pw').value='';$('#pw2').style.display='none';
  $('#lockHint').textContent='Gib das Passwort ein.';$('#lockBtn').textContent='Entsperren'}
$('#lockBtn').onclick=()=>{$('#lockErr').textContent='';
  if($('#pw').value!==PW){$('#lockErr').textContent='Falsches Passwort.';const pw=$('#pw');pw.classList.remove('shake');void pw.offsetWidth;pw.classList.add('shake');return}
  localStorage.setItem('v_ok','1');$('#lock').classList.add('out');setTimeout(()=>{$('#lock').classList.remove('out');lockInit()},280)};
$('#pw').onkeydown=$('#pw2').onkeydown=e=>{if(e.key==='Enter')$('#lockBtn').click()};

/* Navigation */
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){aN=true;tab=b.dataset.t;flt='Alle';addG=false;render();scrollTo(0,0)}};

function chips(){const fr=tab==='frost',cu=fr?CG.frost:CG.lager;
  return `<div class="chips">${['Alle','⏳ Bald ablaufend',...gl(fr)].map(g=>`<button class="chip ${flt===g?'on':''}" data-f="${esc(g)}">${esc(g)}</button>`).join('')}<button class="chip" data-a="grpAdd">+ Eigene</button></div>
  ${addG?`<div class="inl"><input id="gNew" maxlength="24" placeholder="Name der neuen Gruppe" enterkeyhint="done"><button class="btn" id="gAdd">Hinzufügen</button></div>${cu.length?`<div class="chips">${cu.map(g=>`<button class="chip" data-a="gDel" data-g="${esc(g)}">${esc(g)} ✕</button>`).join('')}</div>`:''}`:''}`}
function row(i,mode){const d=days(i.exp);let ex='';
  if(i.exp)ex=d<0?`<span class="bad">abgelaufen seit ${-d} Tg.</span>`:d<=7?`<span class="warn">noch ${d} Tg.</span>`:`bis ${fmtD(i.exp)}`;
  const low=i.qty<=i.min&&i.min>0?'<span class="warn">wenig</span>':'';
  const meta=[`${i.qty} Stk.`,i.g?`${i.g} g`:'',i.pack?`${i.pack} pro Pkg.`:'',i.price?eur(i.price):'',ex,low,i.group].filter(Boolean).join(' · ');
  const img=i.img?`<div class="ph"><img src="${esc(i.img)}" alt="" loading="lazy"></div>`:`<div class="ph">${esc(i.name[0]||'?').toUpperCase()}</div>`;
  const x=d!==null&&d<0&&i.qty>0?`<button class="ib" data-a="exp" data-id="${i.id}" title="Als abgelaufen verbuchen">⚠️</button>`:'';
  return `<div class="row${i.id===popId?' pop':''}">${img}<div class="info"><div class="nm">${esc(i.name)}</div><div class="mt">${meta}</div></div><div class="btns">${x}<button class="ib" data-a="use" data-id="${i.id}" title="Eins verbraucht">−</button><button class="ib" data-a="ed" data-id="${i.id}" title="Bearbeiten">✎</button><button class="ib" data-a="del" data-id="${i.id}" title="Aus der Liste entfernen">🗑</button></div></div>`}
function list(arr,empty){return arr.length?arr.map(row).join(''):`<div class="empty">${empty}</div>`}
const filt=a=>a.filter(i=>flt==='Alle'||(flt==='⏳ Bald ablaufend'?(i.qty>0&&i.exp&&days(i.exp)<=7):(tab==='frost'?(gl(true).includes(i.group)?i.group:'Sonstiges'):i.group)===flt));
const byExp=(a,b)=>(a.exp||'9')<(b.exp||'9')?-1:1;

function renderCore(){if(!unlocked)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(addG&&$('#gNew'))setTimeout(()=>$('#gNew')&&$('#gNew').focus(),0);
  $('#fab').style.display=['lager','frost'].includes(tab)?'block':'none';
  const m=$('#main'),T=TABS.find(t=>t[0]===tab)[2];
  const total=S.items.reduce((s,i)=>s+(i.price||0)*i.qty,0);
  $('#title').innerHTML=({lager:'Dein <em>Lager</em>',frost:'Dein <em>Tiefkühler</em>',auf:'Jetzt <em>aufbrauchen</em>',kauf:'Deine <em>Einkaufsliste</em>',stat:'Dein <em>Verbrauch</em>',rez:'Was du <em>kochen</em> kannst'})[tab];
  $('#sub').textContent=tab==='lager'?`${S.items.filter(i=>!i.frozen).length} Artikel · Wert ${eur(total)}`:'';
  if(tab==='lager')m.innerHTML=chips()+list(filt(S.items.filter(i=>!i.frozen)).sort(byExp),'Noch nichts im Lager. Tippe auf +.');
  else if(tab==='frost')m.innerHTML=chips()+list(filt(S.items.filter(i=>i.frozen)).sort(byExp),'Der Tiefkühler ist leer. Tippe auf +.');
  else if(tab==='auf'){const a=S.items.filter(i=>i.qty>0&&i.exp&&days(i.exp)<=7).sort(byExp);m.innerHTML=list(a,'Nichts läuft in den nächsten 7 Tagen ab.')}
  else if(tab==='kauf')renderShop(m);
  else if(tab==='stat')renderStat(m);
  else renderRec(m)}

let aN=true,popId=null;
function render(){if(!unlocked)return;renderCore();animTick()}
function animTick(){const m=$('#main');if(!m)return;
  if(aN){aN=false;m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');
    ['#title','#sub'].forEach(q=>{const e=$(q);e.classList.remove('sw');void e.offsetWidth;e.classList.add('sw')})}
  else m.classList.remove('enter');
  popId=null}
function renderShop(m){const o=S.shop.filter(s=>!s.done),d=S.shop.filter(s=>s.done);
  const miss=S.items.filter(i=>i.min>0&&i.qty<i.min&&!S.shop.some(s=>!s.done&&s.name.toLowerCase()===i.name.toLowerCase()));
  const c=s=>`<div class="srow"><button class="chk ${s.done?'done':''}${s.id===popId?' pop':''}" data-a="tg" data-id="${s.id}"><span class="dot">✓</span><span class="t">${esc(s.name)}</span></button><button class="ib" style="height:auto;width:52px;border-radius:14px" data-a="sDel" data-id="${s.id}" aria-label="Entfernen">🗑</button></div>`;
  m.innerHTML=`<div class="inl"><input id="sNew" placeholder="Neu auf die Liste…" enterkeyhint="done"><button class="btn" id="sAdd">Hinzufügen</button></div>
  ${miss.length?`<div class="h2">Fehlt im Lager</div>${miss.map(i=>`<div class="row"><div class="info"><div class="nm">${esc(i.name)}</div><div class="mt">${i.qty} von mind. ${i.min}</div></div><button class="ib p" data-a="toShop" data-id="${i.id}">+</button></div>`).join('')}`:''}
  <div class="h2">Offen (${o.length})</div>${o.map(c).join('')||'<div class="empty">Alles erledigt.</div>'}
  ${d.length?`<div class="h2">Erledigt (${d.length})</div>${d.map(c).join('')}<div class="inl"><button class="btn g" id="sClr" style="width:100%">Erledigte entfernen</button></div>`:''}
  ${o.length?`<div class="inl"><button class="btn g" id="sShare" style="width:100%">Teilen oder kopieren</button></div>`:''}`}

function renderStat(m){const y=mon.getFullYear(),mo=mon.getMonth(),n=new Date(y,mo+1,0).getDate(),w=Math.ceil(n/7);
  const u=Array(w).fill(0),x=Array(w).fill(0);let tu=0,tx=0,lost=0;
  S.log.forEach(l=>{const d=new Date(l.t);if(d.getFullYear()===y&&d.getMonth()===mo){const k=Math.min(w-1,Math.floor((d.getDate()-1)/7));if(l.type==='used'){u[k]+=l.n;tu+=l.n}else{x[k]+=l.n;tx+=l.n;lost+=l.v||0}}});
  const mx=Math.max(1,...u,...x);
  m.innerHTML=`<div class="stat"><button class="ib" id="mP">‹</button><b>${mon.toLocaleDateString('de-AT',{month:'long',year:'numeric'})}</b><button class="ib" id="mN">›</button></div>
  <div class="bars">${u.map((v,k)=>`<div class="bg"><div class="bp"><i class="u" style="height:${v/mx*100}%"></i><i class="x" style="height:${x[k]/mx*100}%"></i></div><small>Wo ${k+1}</small></div>`).join('')}</div>
  <div class="leg"><span><b style="background:var(--ac)"></b>Verbraucht</span><span><b style="background:var(--bad)"></b>Abgelaufen</span></div>
  <div class="kpi"><div><strong>${tu}</strong><span>verbraucht</span></div><div><strong>${tx}</strong><span>abgelaufen</span></div><div><strong>${eur(lost)}</strong><span>weggeworfen</span></div><div><strong>${tu+tx?Math.round(tu/(tu+tx)*100):0}%</strong><span>genutzt</span></div></div>
  <div class="h2">Sicherung</div><div class="inl"><button class="btn g" id="bEx" style="flex:1">Exportieren</button><button class="btn g" id="bIm" style="flex:1">Importieren</button></div><input type="file" id="bFile" accept="application/json" style="display:none">`}

let recMode='all',recTag='Alle',recDiff='Alle',recFast=false;
function renderRec(m){const act=S.items.filter(i=>i.qty>0);
  const hit=k=>act.filter(i=>(SYN[k]||[k]).some(x=>i.name.toLowerCase().includes(x)));
  const soon=k=>hit(k).some(i=>i.exp&&days(i.exp)<=7);
  let r=RECIPES.concat(EXTRA).map(([n,ing,how,min,tags])=>{const ok=ing.filter(k=>hit(k).length);return{n,ing,how,min,tags,diff:DIFF[n]||'Leicht',ok,miss:ing.filter(k=>!ok.includes(k)),urg:ok.filter(soon)}}).filter(r=>r.ok.length);
  if(recMode==='soon')r=r.filter(x=>x.urg.length);
  if(recTag!=='Alle')r=r.filter(x=>x.tags.includes(recTag));
  if(recDiff!=='Alle')r=r.filter(x=>x.diff===recDiff);
  if(recFast)r=r.filter(x=>x.min<=20);
  r.sort((a,b)=>(recMode==='soon'?b.urg.length-a.urg.length:0)||b.ok.length/b.ing.length-a.ok.length/a.ing.length);
  const tabs=`<div class="chips"><button class="chip ${recMode==='all'?'on':''}" data-r="all">Alle Rezepte</button><button class="chip ${recMode==='soon'?'on':''}" data-r="soon">⏳ Bald ablaufend</button></div><div class="chips">${['Alle',...RTAGS].map(t=>`<button class="chip ${recTag===t?'on':''}" data-rt="${t}">${t}</button>`).join('')}<button class="chip ${recFast?'on':''}" data-rf="1">⚡ Bis 20 Min.</button></div><div class="chips">${['Alle','Leicht','Mittel','Schwer'].map(t=>`<button class="chip ${recDiff===t?'on':''}" data-rd="${t}">${t==='Alle'?'Alle Stufen':t}</button>`).join('')}</div>`;
  const empty=recMode==='soon'?'Gerade läuft nichts ab, das zu einem Rezept passt. Hier erscheinen Gerichte für Artikel, die in den nächsten 7 Tagen ablaufen.':'Dazu passt gerade kein Rezept. Trage Artikel wie Nudeln, Reis oder Eier ein oder ändere die Filter.';
  m.innerHTML=tabs+(r.length?r.map(r=>`<div class="rc"><h3>${r.n}</h3><div class="mt">⏱ ca. ${r.min>=60?(r.min/60).toString().replace('.',',')+' Std.':r.min+' Min.'} · <span style="color:${({Leicht:'var(--ok)',Mittel:'#fbbf24',Schwer:'var(--bad)'})[r.diff]}">${r.diff}</span> · ${r.tags.join(', ')}</div><div class="bar"><i style="width:${r.ok.length/r.ing.length*100}%"></i></div>${r.ok.map(k=>`<span class="pill y">${r.urg.includes(k)?'⏳ ':''}${k}</span>`).join('')}${r.miss.map(k=>`<span class="pill n">${k} fehlt</span>`).join('')}${r.urg.length?`<div class="mt" style="margin-top:8px"><span class="warn" style="color:#fbbf24">Verbraucht bald ablaufendes: ${r.urg.join(', ')}</span></div>`:''}<div class="mt" style="margin-top:8px">${r.how}</div>${r.miss.length?`<button class="btn g" style="margin-top:10px;padding:8px 12px;font-size:14px" data-a="rShop" data-miss="${r.miss.join(',')}">Fehlendes auf die Einkaufsliste</button>`:'<div class="pill y" style="margin-top:8px">Kannst du jetzt kochen</div>'}</div>`).join(''):`<div class="empty">${empty}</div>`)}

  if(id==='sAdd'){const v=$('#sNew').value.trim();if(!v){$('#sNew').focus();return}try{const nid=uid();popId=nid;S.shop.push({id:nid,name:v,done:false});save()}catch(err){showErr('Speichern: '+err.message)}render();const n=$('#sNew');if(n)n.focus()}
  if(id==='sClr'){S.shop=S.shop.filter(s=>!s.done);save();render()}
  if(id==='sShare'){const t='Einkauf:\n'+S.shop.filter(s=>!s.done).map(s=>'• '+s.name).join('\n');try{navigator.share?await navigator.share({text:t}):(await navigator.clipboard.writeText(t),alert('Liste kopiert.'))}catch{}}

});

/* Automatisch sortieren */
const GUESS=[['Haushalt',/glühbirne|leuchtmittel|lampe|batterie|putz|reiniger|spül|waschmittel|weichspüler|klopapier|toilettenpapier|küchenrolle|taschentuch|tücher|müllsack|müllbeutel|sackerl|schwamm|seife|shampoo|duschgel|zahnpasta|zahnbürste|deo|kerze|alufolie|frischhaltefolie|backpapier|filter|streichholz|zünder|glühlampe|rasier|binden|tampon|windel/],
['Sonstiges',/katzenfutter|hundefutter|tierfutter|katzenstreu|blumenerde|dünger|werkzeug|schraube|kabel|papier|stifte/],
['Getränke',/wasser|saft|cola|fanta|sprite|limo|almdudler|bier|wein|sekt|prosecco|schnaps|radler|spritzer|tee|kaffee|kakao|sirup|energy|mineral|sprudel|getränk/]];
const FROZEN=/tiefkühl|fischstäbchen|pommes|eiscreme|speiseeis|\beis\b|\btk\b|tk-|gefroren/;
function guess(n){n=n.toLowerCase();const g=GUESS.find(x=>x[1].test(n));return{group:g?g[0]:'Lebensmittel',frozen:FROZEN.test(n)}}
const FGUESS=[['Fisch',/fisch|lachs|garnele|forelle|thunfisch|scampi|calamari|meeresfrüchte/],['Fleisch',/fleisch|hendl|huhn|hühner|geflügel|schnitzel|burger|wurst|würstel|speck|schinken|faschiert|hack|steak|cordon|nuggets|braten|gulasch|leberkäs/],['Gemüse',/gemüse|spinat|erbsen|brokkoli|karfiol|blumenkohl|mais|beeren|obst|bohnen|fisolen|kräuter|suppengrün|karotten|paprika|zwiebel/],['Eis & Süßes',/\beis\b|eiscreme|speiseeis|kuchen|torte|dessert|sorbet|waffel/],['Fertiggerichte',/pizza|pommes|lasagne|fertig|knödel|strudel|croissant|brot|semmel|weckerl|teig|nockerl|gnocchi|ravioli|suppe|menü|auflauf/]];
function fguess(n){n=n.toLowerCase();const g=FGUESS.find(x=>x[1].test(n));return g?g[0]:'Sonstiges'}
let gT=false,fT=false;
function setGroups(fr,val){const L=gl(fr);$('#fGrp').innerHTML=L.map(g=>`<option>${g}</option>`).join('');$('#fGrp').value=L.includes(val)?val:(fr?'Sonstiges':'Lebensmittel')}
function autoSort(){if(editId)return;const n=$('#fName').value,g=guess(n);
  const fr=fT?$('#fFr').checked:(g.frozen||tab==='frost');if(!fT)$('#fFr').checked=fr;

/*SYNC*/
/* Synchronisation über Firebase Realtime Database (aus, solange SYNC_URL leer ist) */
const SYNC_URL='';  // z. B. 'https://dein-projekt-default-rtdb.europe-west1.firebasedatabase.app'
const SYNC_ROOT=SYNC_URL?SYNC_URL.replace(/\/+$/,'')+'/vorrat':'';
let SNAP=load('v_snap',{items:{},shop:{}}),TOMB=load('v_tomb',{items:{},shop:{}}),DIRTY=load('v_dirty',{}),CGU=load('v_cgu',0);
let pushing=false,pushT=null,pendingR=false;
const sj=o=>JSON.stringify(Object.keys(o).filter(k=>k!=='u').sort().map(k=>[k,o[k]]));
function persistSync(){try{localStorage.setItem('v_snap',JSON.stringify(SNAP));localStorage.setItem('v_tomb',JSON.stringify(TOMB));localStorage.setItem('v_dirty',JSON.stringify(DIRTY));localStorage.setItem('v_cgu',JSON.stringify(CGU))}catch{}}
function stamp(){if(!SYNC_ROOT)return;const now=Date.now();
  for(const k of ['items','shop']){const cur={};
    S[k].forEach(o=>{cur[o.id]=1;const j=sj(o);if(SNAP[k][o.id]!==j){o.u=now;SNAP[k][o.id]=j;DIRTY[k+'/'+o.id]=Math.random();delete TOMB[k][o.id]}});
    Object.keys(SNAP[k]).forEach(id=>{if(!cur[id]){delete SNAP[k][id];TOMB[k][id]=now;DIRTY[k+'/'+id]=Math.random()}})}
  S.log.forEach(l=>{if(!l.id){l.id=uid();DIRTY['log/'+l.id]=Math.random()}});
  persistSync();pushSoon()}
function cgChanged(){if(!SYNC_ROOT)return;CGU=Date.now();DIRTY.cg=Math.random();persistSync();pushSoon()}
function recFor(p){const[k,id]=p.split('/');
  if(k==='cg')return{lager:CG.lager,frost:CG.frost,u:CGU};
  if(k==='log')return S.log.find(l=>l.id===id)||null;
  const o=S[k].find(x=>x.id===id);return o?{...o}:{del:1,u:TOMB[k][id]||Date.now()}}
function setSyn(ok){const e=$('#syn');if(e)e.textContent=SYNC_ROOT?(ok?'☁️ synchronisiert':'⚠️ offline, wird nachgeholt'):''}
function pushSoon(){clearTimeout(pushT);pushT=setTimeout(()=>syncNow(),400)}
async function push(){const keys=Object.keys(DIRTY);if(!keys.length)return;
  const sent={},body={};keys.forEach(p=>{sent[p]=DIRTY[p];const r=recFor(p);if(r)body[p]=r});
  const res=await fetch(SYNC_ROOT+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok)throw new Error('push');
  keys.forEach(p=>{if(DIRTY[p]===sent[p])delete DIRTY[p]});persistSync()}
async function pull(){const res=await fetch(SYNC_ROOT+'.json');if(!res.ok)throw new Error('pull');const R=(await res.json())||{};let ch=false;
  for(const k of ['items','shop']){const rem=R[k]||{};
    for(const id in rem){const r=rem[id],loc=S[k].find(x=>x.id===id);if(!r)continue;
      if(r.del){if(loc&&(loc.u||0)<=r.u){S[k]=S[k].filter(x=>x.id!==id);delete SNAP[k][id];ch=true}TOMB[k][id]=Math.max(TOMB[k][id]||0,r.u);continue}
      if(!loc){if((TOMB[k][id]||0)>=r.u)continue;S[k].push(r);SNAP[k][id]=sj(r);delete TOMB[k][id];ch=true}
      else if((r.u||0)>(loc.u||0)){Object.keys(loc).forEach(x=>delete loc[x]);Object.assign(loc,r);SNAP[k][id]=sj(loc);ch=true}}}
  const have=new Set(S.log.map(l=>l.id));
  for(const id in (R.log||{})){if(!have.has(id)&&R.log[id]){S.log.push(R.log[id]);ch=true}}
  const c=R.cg;if(c&&(c.u||0)>CGU){CG.lager=c.lager||[];CG.frost=c.frost||[];CGU=c.u;saveCG();ch=true}
  if(ch){saveRaw();persistSync();pendingR=true}
  if(pendingR){const a=document.activeElement;if(!(a&&a.closest&&a.closest('#main')&&/INPUT|SELECT/.test(a.tagName))){pendingR=false;render()}}}
async function syncNow(){if(!SYNC_ROOT||!unlocked)return;try{await push();await pull();setSyn(true)}catch{setSyn(false)}}
if(SYNC_ROOT){
  if(!CGU&&(CG.lager.length||CG.frost.length)){CGU=Date.now();DIRTY.cg=Math.random()}
  stamp();setSyn(true);
  setInterval(syncNow,8000);setTimeout(syncNow,600);
  addEventListener('online',syncNow);addEventListener('focus',syncNow);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()})}
/*ENDSYNC*/
/* App-Installation: erst nach dem Passwort verfügbar (Manifest und Service Worker werden erst dann geladen) */
let instEv=null,unlockedOnce=false;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let toastT=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}
function showInst(){const hide=!unlocked||isStandalone();
  $('#instTop').style.display=hide?'none':'block';
  if(hide)$('#instHint').classList.remove('on')}
function fillHint(){const ios=isIOS();
  $('#instH').textContent=ios?'So installierst du die App:':'So installierst du die App:';
  $('#instOl').innerHTML=(ios
    ?['Tippe unten in Safari auf „Teilen“ ⬆️','Wähle „Zum Home-Bildschirm“','Bestätige oben rechts mit „Hinzufügen“']
    :['Öffne das Browser-Menü ⋮ (oben rechts)','Wähle „App installieren“ oder „Zum Startbildschirm hinzufügen“','Bestätige mit „Installieren“']).map(x=>'<li>'+x+'</li>').join('')}
function onUnlocked(){
  if(!unlockedOnce){unlockedOnce=true;
    const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);
    if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{})}
  showInst()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;showInst()});
addEventListener('appinstalled',()=>{instEv=null;showInst();toast('✅ App installiert')});
$('#instTop').onclick=async()=>{
  if(instEv){instEv.prompt();try{const r=await instEv.userChoice;if(r&&r.outcome==='accepted')toast('✅ App wird installiert')}catch{}instEv=null;return}
  const h=$('#instHint');if(h.classList.contains('on')){h.classList.remove('on');return}
  fillHint();h.classList.remove('on');void h.offsetWidth;h.classList.add('on')};
lockInit();
